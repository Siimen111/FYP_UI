<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VTrack Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient">
      <div class="blob blob--gold"></div>
      <div class="blob blob--sage"></div>
      <div class="grid"></div>
    </div>

    <main class="shell">
      <div class="view view--active" id="consoleView">
        <header class="hero">
          <p class="kicker">VTrack Desktop</p>
          <h1>Merge Control Room</h1>
          <p class="lead">
            Pick commits, resolve conflicts, and apply AI merge suggestions with
            your FastAPI backend.
          </p>
        </header>

        <section class="panel">
          <h2>API Connection</h2>
          <label>
            API Base URL
            <input id="apiBase" type="text" value="http://127.0.0.1:8000" />
          </label>
          <label>
            Base Model Path
            <input
              id="baseModel"
              type="text"
              value="C:\\Users\\sherm\\FYP\\src\\gemma_3_4b_it"
            />
          </label>
        <button id="refreshCommits" class="btn btn--primary">
          Refresh commits
        </button>
        <button id="resetCommits" class="btn btn--ghost" type="button">
          Clear commits
        </button>
      </section>

        <section class="panel">
          <div class="panel__head">
            <h2>Commit Picker</h2>
            <div class="status" id="commitStatus">Idle</div>
          </div>
          <div class="commit-list" id="commitList"></div>
        </section>

        <section class="panel">
          <h2>Merge</h2>
          <p class="meta" id="selectionMeta">Base: -- | Left: -- | Right: --</p>
          <button id="runMerge" class="btn btn--primary">Run merge</button>
          <div class="result" id="mergeResult"></div>
        </section>

        <section class="panel">
          <h2>Suggestion Panel</h2>
          <label>
            Mode
            <select id="suggestMode">
              <option value="full" selected>Full (merge)</option>
              <option value="partial">Partial (recommend)</option>
              <option value="alert">Alert (review)</option>
            </select>
          </label>
          <div class="progress" id="suggestProgress" aria-hidden="true">
            <div class="progress__label">Idle</div>
            <div class="progress__bar">
              <div class="progress__fill"></div>
            </div>
          </div>
          <button id="runSuggest" class="btn btn--primary">
            Generate suggestion
          </button>
          <div class="result" id="suggestResult"></div>
          <div class="inline-actions" id="suggestActions"></div>
        </section>

        <section class="panel">
          <h2>Apply</h2>
          <label>
            Author
            <input id="author" type="text" value="Lawyer A" />
          </label>
          <label>
            Message
            <input id="message" type="text" value="Apply suggestion" />
          </label>
          <button id="runApply" class="btn btn--primary">
            Apply suggestion
          </button>
          <div class="result" id="applyResult"></div>
        </section>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="renderer.js"></script>
  </body>
</html>
